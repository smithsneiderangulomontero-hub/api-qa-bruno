trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseNode@1
    inputs:
      version: "22.x"
    displayName: "Install Node.js"

  # Configurar la ruta del directorio de caché de npm
  - script: |
      echo "##vso[task.setvariable variable=npm_config_cache]$(Pipeline.Workspace)/.npm"
    displayName: "Set npm cache folder"

  # Tarea nativa de caché de Azure DevOps
  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: "$(Pipeline.Workspace)/.npm"
    displayName: "Cache npm packages"

  - script: npm install -g @usebruno/cli
    displayName: "Install Bruno CLI"

  - script: |
      mkdir -p $(Build.SourcesDirectory)/reports
      bru run --env public \
        --reporter-junit $(Build.SourcesDirectory)/reports/junit.xml \
        --reporter-html $(Build.SourcesDirectory)/reports/report.html
    workingDirectory: collections/restful-booker
    displayName: "Run Bruno collection"

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: "$(Build.SourcesDirectory)/reports/junit.xml"
      testRunTitle: "Bruno API tests"

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: "$(Build.SourcesDirectory)/reports"
      artifact: bruno-reports
    displayName: "Publish HTML report"

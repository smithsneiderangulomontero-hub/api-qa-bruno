trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: "Install Node.js"

  - script: npm install -g @usebruno/cli
    displayName: "Install Bruno CLI"

  - script: |
      mkdir -p $(Build.SourcesDirectory)/reports
      bru run --env public \
        --reporter-junit $(Build.SourcesDirectory)/reports/junit.xml \
        --reporter-html $(Build.SourcesDirectory)/reports/report.html
    workingDirectory: collections/restful-booker
    displayName: "Run Bruno collection"

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: reports/junit.xml
      testRunTitle: "Bruno API tests"

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: reports
      artifact: bruno-reports
    displayName: Publish HTML report

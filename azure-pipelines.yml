trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: "Install Node.js"

  - script: |
      echo "##vso[task.setvariable variable=npm_config_cache]$(Pipeline.Workspace)/.npm"
    displayName: "Set npm cache folder"

  - task: Cache@2
    inputs:
      key: 'npm | "$(Agent.OS)" | package-lock.json'
      restoreKeys: |
        npm | "$(Agent.OS)"
      path: "$(Pipeline.Workspace)/.npm"
    displayName: "Cache npm packages"

  - script: npm ci
    displayName: "Install dependencies"

  - script: npm run typecheck
    displayName: "Type-check generator"

  - script: |
      set -o pipefail
      mkdir -p reports
      npm run test:ci 2>&1 | tee reports/bru-output.log
      if grep -qi "skipping invalid file" reports/bru-output.log; then
        echo "##vso[task.logissue type=error]Hay archivos .yml invalidos en la coleccion"
        exit 1
      fi
    displayName: "Run Bruno collection"

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: "$(Build.SourcesDirectory)/reports/junit.xml"
      testRunTitle: "Bruno API tests"

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: "$(Build.SourcesDirectory)/reports"
      artifact: bruno-reports
    displayName: "Publish HTML report"
